[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ft_package"
version = "0.0.1"
description = "A simple Python package for counting items in lists"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "doriani", email = "doriani@student.42roma.it"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.7"
dependencies = []

[project.urls]
Homepage = "https://github.com/yourusername/ft_package"
Repository = "https://github.com/yourusername/ft_package.git"
Issues = "https://github.com/yourusername/ft_package/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ft_package*"]

[tool.setuptools.package-data]
ft_package = ["*.txt", "*.md"]